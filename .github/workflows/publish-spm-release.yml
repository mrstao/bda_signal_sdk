name: Publish SPM release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version tag to publish"
        required: true
        default: "2.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"

      - name: Validate package
        run: |
          swift package dump-package
          swift package describe

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          VERSION: \${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $VERSION"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep an existing tag unchanged; create it only when missing.
          if git ls-remote --exit-code --tags origin \
            "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists. Keeping existing tag."
          else
            git tag "$VERSION" HEAD
            git push origin "$VERSION"
          fi

          # Explicitly create the release in this fork, not the upstream remote.
          if gh release view "$VERSION" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists in $GITHUB_REPOSITORY."
          else
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "BDASignalSDK $VERSION" \
              --generate-notes
          fi
