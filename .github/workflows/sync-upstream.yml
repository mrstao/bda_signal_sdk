name: Sync upstream and publish

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: macos-14
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure upstream
        run: |
          git remote add upstream https://github.com/oceanengine/bda_signal_sdk.git
          git fetch upstream --tags

      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --no-edit upstream/main
          git push origin main

      - name: Validate Swift package
        run: swift package dump-package

      - name: Publish upstream version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_tag="$(git tag -l | grep -E '^[0-9]+\\.[0-9]+\\.[0-9]+([.-].*)?$' | sort -V | tail -n 1)"
          if [ -z "$latest_tag" ]; then
            echo "No semantic version tag found in upstream repository."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$latest_tag" >/dev/null 2>&1; then
            echo "Tag $latest_tag already exists in fork."
            exit 0
          fi
          git tag "$latest_tag" "upstream/main"
          git push origin "$latest_tag"
          gh release create "$latest_tag" --title "BDASignalSDK $latest_tag" --generate-notes

  package-check:
    if: github.event_name == 'push'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Validate package manifest
        run: swift package dump-package
