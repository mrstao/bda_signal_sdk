name: Sync upstream and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  # The first push after SPM setup creates the initial version tag.
  # Later upstream version tags are handled by the scheduled/manual sync job.
  initial-release:
    if: github.event_name == 'push'
    runs-on: macos-14
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create initial SPM version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^[[:space:]]*spec.version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' BDASignalSDK.podspec | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "Unable to read SDK version from BDASignalSDK.podspec."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "Version tag $version already exists."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$version" HEAD
          git push origin "$version"
          gh release create "$version" --title "BDASignalSDK $version" --generate-notes

  sync:
    if: github.event_name != 'push'
    runs-on: macos-14
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure upstream
        run: |
          git remote add upstream https://github.com/oceanengine/bda_signal_sdk.git
          git fetch upstream --prune --tags

      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --no-edit upstream/main

      - name: Validate Swift package manifest
        run: |
          swift package dump-package
          swift package describe

      - name: Push synchronized main
        run: git push origin main

      - name: Publish latest upstream version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list | grep -E '^[0-9]+[.][0-9]+[.][0-9]+([.-].*)?$' | sort -V | tail -n 1 || true)"
          if [[ -z "$latest_tag" ]]; then
            echo "No semantic version tag found upstream; skipping release."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$latest_tag" >/dev/null 2>&1; then
            echo "Tag $latest_tag already exists in fork."
            exit 0
          fi

          # Point the SPM tag at the merged fork commit, which contains Package.swift.
          git tag -d "$latest_tag"
          git tag "$latest_tag" HEAD
          git push origin "$latest_tag"
          gh release create "$latest_tag" --title "BDASignalSDK $latest_tag" --generate-notes

  package-check:
    if: github.event_name == 'push'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Validate package manifest
        run: |
          swift package dump-package
          swift package describe
