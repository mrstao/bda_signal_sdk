name: Sync upstream and publish

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure upstream
        run: |
          git remote add upstream https://github.com/oceanengine/bda_signal_sdk.git

          # Fetch upstream branches without importing tags into refs/tags.
          git fetch upstream --prune --no-tags

          # Keep upstream tags in a separate namespace to avoid collisions
          # with tags owned by this fork.
          git fetch upstream --prune \
            '+refs/tags/*:refs/remotes/upstream/tags/*'

      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --no-edit upstream/main


      - name: Validate Swift package manifest
        run: |
          swift --version
          swift package dump-package
          swift package describe

      - name: Push synchronized main
        run: git push origin main

      - name: Publish latest upstream version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # Read version tags from the isolated upstream namespace.
          latest_tag="$(
            git for-each-ref \
              --format='%(refname:strip=4)' \
              refs/remotes/upstream/tags \
            | grep -E '^[0-9]+[.][0-9]+[.][0-9]+([.-].*)?$' \
            | sort -V \
            | tail -n 1 || true
          )"

          if [[ -z "$latest_tag" ]]; then
            echo "No semantic version tag found upstream; skipping release."
            exit 0
          fi

          echo "Latest upstream version: $latest_tag"

          # Never move or overwrite a tag that already exists in the fork.
          if git ls-remote --exit-code --tags origin \
            "refs/tags/$latest_tag" >/dev/null 2>&1; then
            echo "Tag $latest_tag already exists in fork; keeping it."
          else
            # Point a new SPM tag at the synchronized fork commit,
            # which contains Package.swift and the SwiftPM wrapper.
            git tag "$latest_tag" HEAD
            git push origin "$latest_tag"
          fi

          # gh may otherwise select the upstream remote. Always target this fork.
          if gh release view "$latest_tag" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $latest_tag already exists in $GITHUB_REPOSITORY."
          else
            gh release create "$latest_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "BDASignalSDK $latest_tag" \
              --generate-notes
          fi

  package-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate package manifest
        run: |
          swift --version
          swift package dump-package
          swift package describe
